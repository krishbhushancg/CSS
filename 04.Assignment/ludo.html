<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ludo Board</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 12px;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: #f0f0f0;
    font-family: Arial, sans-serif;
}

.board {
    width: min(95vw, 450px);
    aspect-ratio: 1;
    display: flex;
    flex-direction: column;
    border: 2px solid #333;
    background: white;
}

.row {
    display: flex;
    flex: 6;
    min-height: 0;
}

.home {
    flex: 6;
    display: flex;
    justify-content: center;
    align-items: center;
}

.red { background: #e53935; }
.green { background: #43a047; }
.blue { background: #1e88e5; }
.yellow { background: #fdd835; }

.inner {
    width: 68%;
    aspect-ratio: 1;
    background: white;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-evenly;
    align-content: space-evenly;
    padding: 8px;
    border-radius: 4px;
}

.token {
    width: 38%;
    aspect-ratio: 1;
    border: 3px solid;
    border-radius: 50%;
    background: white;
}

.red .token { border-color: #e53935; }
.green .token { border-color: #26bd2e; }
.blue .token { border-color: #1e88e5; }
.yellow .token { border-color: #fdd835; }

.track {
    flex: 3;
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
}

.track-row {
    display: flex;
    flex: 1;
    min-height: 0;
}

.cell {
    flex: 1;
    min-width: 0;
    min-height: 0;
    border: 0.5px solid #bbb;
    background: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(8px, 2.5vw, 14px);
    padding: 0;
}

.r { background: #ffcdd2; }
.g { background: #c8e6c9; }
.b { background: #bbdefb; }
.y { background: #fff9c4; }

.cell.r { background: #ffcdd2; color: #b71c1c; }
.cell.g { background: #c8e6c9; color: #1b5e20; }
.cell.b { background: #bbdefb; color: #0d47a1; }
.cell.y { background: #fff9c4; color: #f57f17; }

.middle {
    display: flex;
    flex: 3;
    min-height: 0;
}

.center {
    flex: 3;
    aspect-ratio: 1;
    position: relative;
    overflow: hidden;
    background: #fff;
}

.triangle {
    position: absolute;
    width: 50%;
    height: 50%;
}

.tr {
    top: 0;
    left: 0;
    background: #e53935;
    clip-path: polygon(0 0, 0 100%, 50% 50%);
}

.tg {
    top: 0;
    right: 0;
    background: #43a047;
    clip-path: polygon(0 0, 100% 0, 50% 50%);
}

.tb {
    bottom: 0;
    left: 0;
    background: #1e88e5;
    clip-path: polygon(0 100%, 100% 100%, 50% 50%);
}

.ty {
    bottom: 0;
    right: 0;
    background: #fdd835;
    clip-path: polygon(100% 0, 100% 100%, 50% 50%);
}
</style>
</head>

<body>

<div class="board">

    <!-- TOP SECTION -->
    <div class="row">
        <div class="home red">
            <div class="inner">
                <div class="token"></div>
                <div class="token"></div>
                <div class="token"></div>
                <div class="token"></div>
            </div>
        </div>

        <div class="track">
            <div class="track-row">
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
            </div>
            <div class="track-row">
                <div class="cell"></div>
                <div class="cell g"></div>
                <div class="cell"></div>
            </div>
            <div class="track-row">
                <div class="cell g">★</div>
                <div class="cell g"></div>
                <div class="cell"></div>
            </div>
            <div class="track-row">
                <div class="cell"></div>
                <div class="cell g"></div>
                <div class="cell g">★</div>
            </div>
            <div class="track-row">
                <div class="cell"></div>
                <div class="cell g"></div>
                <div class="cell"></div>
            </div>
            <div class="track-row">
                <div class="cell"></div>
                <div class="cell g"></div>
                <div class="cell"></div>
            </div>
        </div>

        <div class="home green">
            <div class="inner">
                <div class="token"></div>
                <div class="token"></div>
                <div class="token"></div>
                <div class="token"></div>
            </div>
        </div>
    </div>

    <!-- MIDDLE SECTION -->
    <div class="middle">
        <div class="track">
            <div class="track-row">
                <div class="cell"></div>
                <div class="cell r"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
            </div>
            <div class="track-row">
                <div class="cell r">★</div>
                <div class="cell r"></div>
                <div class="cell r"></div>
                <div class="cell r"></div>
                <div class="cell r"></div>
                <div class="cell r"></div>
            </div>
            <div class="track-row">
                <div class="cell"></div>
                <div class="cell r"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell r">★</div>
                <div class="cell"></div>
            </div>
        </div>

        <div class="center">
            <div class="triangle tr"></div>
            <div class="triangle tg"></div>
            <div class="triangle tb"></div>
            <div class="triangle ty"></div>
        </div>

        <div class="track">
            <div class="track-row">
                <div class="cell"></div>
                <div class="cell y">★</div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
            </div>
            <div class="track-row">
                <div class="cell y"></div>
                <div class="cell y"></div>
                <div class="cell y"></div>
                <div class="cell y"></div>
                <div class="cell y"></div>
                <div class="cell y">★</div>
            </div>
            <div class="track-row">
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell y"></div>
                <div class="cell"></div>
            </div>
        </div>
    </div>

    <!-- BOTTOM SECTION -->
    <div class="row">
        <div class="home blue">
            <div class="inner">
                <div class="token"></div>
                <div class="token"></div>
                <div class="token"></div>
                <div class="token"></div>
            </div>
        </div>

        <div class="track">
            <div class="track-row">
                <div class="cell"></div>
                <div class="cell b"></div>
                <div class="cell"></div>
            </div>
            <div class="track-row">
                <div class="cell"></div>
                <div class="cell b"></div>
                <div class="cell"></div>
            </div>
            <div class="track-row">
                <div class="cell b">★</div>
                <div class="cell b"></div>
                <div class="cell"></div>
            </div>
            <div class="track-row">
                <div class="cell"></div>
                <div class="cell b"></div>
                <div class="cell b">★</div>
            </div>
            <div class="track-row">
                <div class="cell"></div>
                <div class="cell b"></div>
                <div class="cell"></div>
            </div>
            <div class="track-row">
                <div class="cell"></div>
                <div class="cell "></div>
                <div class="cell"></div>
            </div>
        </div>

        <div class="home yellow">
            <div class="inner">
                <div class="token"></div>
                <div class="token"></div>
                <div class="token"></div>
                <div class="token"></div>
            </div>
        </div>
    </div>

</div>

</body>
</html>
