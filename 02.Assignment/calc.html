<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Calculator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #1c1c1c;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }

        .calculator {
            width: min(100%, 380px);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            border: 3px solid white;
            border-radius: 50px;
        }

        .display {
            color: white;
            font-size: clamp(48px, 15vw, 100px);
            text-align: right;
            padding: 10px 0 20px;
            overflow: hidden;
            border: 3px solid white;
            border-radius: 50px;
        }

        .row {
            display: flex;
            gap: 18px;
        }

        .btn {
            flex: 1;
            aspect-ratio: 1;
            border: none;
            border-radius: 50%;
            background: #505050;
            color: white;
            font-size: 28px;

        }

        .light {
            background: #a5a5a5;
            color: black;
        }

        .orange {
            background: #ff9800;
            color: white;
        }

        .zero {
            flex-grow: 2;
            aspect-ratio: auto;
            border-radius: 50px;
            text-align: left;
            padding-left: 32px;
        }

        @media (max-width: 350px) {
            .calculator {
                padding: 12px;
                gap: 12px;
            }

            .row {
                gap: 12px;
            }

            .btn {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>

    <div class="calculator">

        <div class="display">7744</div>

        <div class="row">
            <button class="btn light">C</button>
            <button class="btn light">+/-</button>
            <button class="btn light">%</button>
            <button class="btn orange">÷</button>
        </div>

        <div class="row">
            <button class="btn">7</button>
            <button class="btn">8</button>
            <button class="btn">9</button>
            <button class="btn orange">x</button>
        </div>

        <div class="row">
            <button class="btn">4</button>
            <button class="btn">5</button>
            <button class="btn">6</button>
            <button class="btn orange">-</button>
        </div>

        <div class="row">
            <button class="btn">1</button>
            <button class="btn">2</button>
            <button class="btn">3</button>
            <button class="btn orange">+</button>
        </div>

        <div class="row">
            <button class="btn zero">0</button>
            <button class="btn">,</button>
            <button class="btn orange">=</button>
        </div>

    </div>

</body>
</html>
