
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sudoku Flexbox Layout</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 25px;
    font-family: Arial, sans-serif;
    background: white;
}

.container {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    gap: 40px;
    flex-wrap: wrap;
}

.puzzle {
    display: flex;
    flex-direction: column;
    flex: 1 1 320px;
    max-width: 365px;
}

h2 {
    text-align: center;
    font-size: 25px;
    font-weight: 400;
    letter-spacing: 2px;
    margin: 0 0 22px;
}

.grid {
    display: flex;
    flex-direction: column;
    width: 100%;
    aspect-ratio: 1 / 1;
    border: 2px solid #333;
}

.row {
    display: flex;
    flex: 1;
}

.cell {
    display: flex;
    flex: 1;
    align-items: center;
    justify-content: center;
    border-right: 1px solid #777;
    border-bottom: 1px solid #777;
    font-size: clamp(14px, 2.5vw, 27px);
    color: #222;
}

.cell:last-child {
    border-right: none;
}

.row:last-child .cell {
    border-bottom: none;
}

/* Thick borders around every 3x3 box */
.row:nth-child(3n) .cell {
    border-bottom: 3px solid #333;
}

.row:nth-child(3n) {
    border-bottom: none;
}

.cell:nth-child(3n) {
    border-right: 3px solid #333;
}

.cell:last-child {
    border-right: none;
}

.green {
    background: #a8d9bd;
}

@media (max-width: 600px) {
    body {
        padding: 15px;
    }

    .container {
        gap: 30px;
    }

    .puzzle {
        flex: 1 1 100%;
        max-width: 400px;
    }

    h2 {
        margin-bottom: 12px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="puzzle">
        <h2>SUDOKU</h2>
        <div class="grid">

            <div class="row">
                <div class="cell">8</div><div class="cell"></div><div class="cell">6</div>
                <div class="cell green"></div><div class="cell green"></div><div class="cell green">3</div>
                <div class="cell"></div><div class="cell">9</div><div class="cell"></div>
            </div>

            <div class="row">
                <div class="cell"></div><div class="cell">4</div><div class="cell"></div>
                <div class="cell green"></div><div class="cell green">1</div><div class="cell green"></div>
                <div class="cell"></div><div class="cell">6</div><div class="cell">8</div>
            </div>

            <div class="row">
                <div class="cell">2</div><div class="cell"></div><div class="cell"></div>
                <div class="cell green">8</div><div class="cell green">7</div><div class="cell green"></div>
                <div class="cell"></div><div class="cell"></div><div class="cell">5</div>
            </div>

            <div class="row">
                <div class="cell green">1</div><div class="cell green"></div><div class="cell green">8</div>
                <div class="cell"></div><div class="cell"></div><div class="cell">5</div>
                <div class="cell green"></div><div class="cell green">2</div><div class="cell green"></div>
            </div>

            <div class="row">
                <div class="cell green"></div><div class="cell green">3</div><div class="cell green"></div>
                <div class="cell">1</div><div class="cell"></div><div class="cell"></div>
                <div class="cell green"></div><div class="cell green">5</div><div class="cell green"></div>
            </div>

            <div class="row">
                <div class="cell green">7</div><div class="cell green"></div><div class="cell green">5</div>
                <div class="cell"></div><div class="cell">3</div><div class="cell"></div>
                <div class="cell green">9</div><div class="cell green"></div><div class="cell green"></div>
            </div>

            <div class="row">
                <div class="cell"></div><div class="cell">2</div><div class="cell">1</div>
                <div class="cell green"></div><div class="cell green"></div><div class="cell green">7</div>
                <div class="cell"></div><div class="cell">4</div><div class="cell"></div>
            </div>

            <div class="row">
                <div class="cell">6</div><div class="cell"></div><div class="cell"></div>
                <div class="cell green"></div><div class="cell green">2</div><div class="cell green"></div>
                <div class="cell">8</div><div class="cell"></div><div class="cell"></div>
            </div>

            <div class="row">
                <div class="cell"></div><div class="cell">8</div><div class="cell">7</div>
                <div class="cell green">6</div><div class="cell green"></div><div class="cell green">4</div>
                <div class="cell"></div><div class="cell"></div><div class="cell">3</div>
            </div>

        </div>
    </div>


    <div class="puzzle">
        <h2>ANSWER</h2>
        <div class="grid">

            <div class="row">
                <div class="cell">8</div><div class="cell">7</div><div class="cell">6</div>
                <div class="cell green">5</div><div class="cell green">4</div><div class="cell green">3</div>
                <div class="cell">1</div><div class="cell">9</div><div class="cell">2</div>
            </div>

            <div class="row">
                <div class="cell">5</div><div class="cell">4</div><div class="cell">3</div>
                <div class="cell green">2</div><div class="cell green">1</div><div class="cell green">9</div>
                <div class="cell">7</div><div class="cell">6</div><div class="cell">8</div>
            </div>

            <div class="row">
                <div class="cell">2</div><div class="cell">1</div><div class="cell">9</div>
                <div class="cell green">8</div><div class="cell green">7</div><div class="cell green">6</div>
                <div class="cell">4</div><div class="cell">3</div><div class="cell">5</div>
            </div>

            <div class="row">
                <div class="cell green">1</div><div class="cell green">9</div><div class="cell green">8</div>
                <div class="cell">7</div><div class="cell">6</div><div class="cell">5</div>
                <div class="cell green">3</div><div class="cell green">2</div><div class="cell green">4</div>
            </div>

            <div class="row">
                <div class="cell green">4</div><div class="cell green">3</div><div class="cell green">2</div>
                <div class="cell">1</div><div class="cell">9</div><div class="cell">8</div>
                <div class="cell green">6</div><div class="cell green">5</div><div class="cell green">7</div>
            </div>

            <div class="row">
                <div class="cell green">7</div><div class="cell green">6</div><div class="cell green">5</div>
                <div class="cell">4</div><div class="cell">3</div><div class="cell">2</div>
                <div class="cell green">9</div><div class="cell green">8</div><div class="cell green">1</div>
            </div>

            <div class="row">
                <div class="cell">3</div><div class="cell">2</div><div class="cell">1</div>
                <div class="cell green">9</div><div class="cell green">8</div><div class="cell green">7</div>
                <div class="cell">5</div><div class="cell">4</div><div class="cell">6</div>
            </div>

            <div class="row">
                <div class="cell">6</div><div class="cell">5</div><div class="cell">4</div>
                <div class="cell green">3</div><div class="cell green">2</div><div class="cell green">1</div>
                <div class="cell">8</div><div class="cell">7</div><div class="cell">9</div>
            </div>

            <div class="row">
                <div class="cell">9</div><div class="cell">8</div><div class="cell">7</div>
                <div class="cell green">6</div><div class="cell green">5</div><div class="cell green">4</div>
                <div class="cell">2</div><div class="cell">1</div><div class="cell">3</div>
            </div>

        </div>
    </div>

</div>

</body>
</html>
