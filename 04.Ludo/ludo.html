        .cont{

            height: 40%;

        .pathbottom{

            border: 5px solid green;

            border-radius: 50%;
            justify-content: space-around;
            height: 40px;
            width: 40px;

        }

        .rtoken{

        .centre{

        .bluepath{

.red1{

.blue1{
